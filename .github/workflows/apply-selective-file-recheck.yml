name: Apply selective file recheck edits

on:
  push:
    branches:
      - feature/selective-file-recheck-stage2

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/selective-file-recheck-stage2
          fetch-depth: 0
      - name: Apply exact source edits
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "include/libtorrent/torrent_handle.hpp",
              "\t\tvoid force_recheck() const;\n\n\t\t// the disk cache will be flushed before creating the resume data.",
              "\t\tvoid force_recheck() const;\n\n"
              "\t\t// Re-hash only pieces overlapping the specified files. Pieces that are\n"
              "\t\t// currently missing are skipped. Pieces that pass remain untouched while\n"
              "\t\t// pieces that fail are marked missing and become eligible for download.\n"
              "\t\t// Unlike force_recheck(), this does not reset unrelated piece state,\n"
              "\t\t// disconnect peers, or put the torrent into the global checking queue.\n"
              "\t\t// Boundary pieces may read bytes belonging to adjacent files because\n"
              "\t\t// BitTorrent hashes are piece-based.\n"
              "\t\tvoid recheck_files(std::vector<file_index_t> files) const;\n\n"
              "\t\t// the disk cache will be flushed before creating the resume data."
          )

          replace_once(
              "include/libtorrent/aux_/torrent.hpp",
              "\t\tvoid files_checked();\n\t\tvoid start_checking();",
              "\t\tvoid files_checked();\n\t\tvoid recheck_files(std::vector<file_index_t> files);\n\t\tvoid start_checking();"
          )

          implementation = r'''
	void torrent_handle::recheck_files(std::vector<file_index_t> files) const
	{
		async_call(&aux::torrent::recheck_files, std::move(files));
	}

	void aux::torrent::recheck_files(std::vector<file_index_t> files)
	{
		TORRENT_ASSERT(is_single_thread());

		if (m_abort || m_deleted || !valid_metadata() || !m_storage)
			return;

		if (state() == torrent_status::checking_files
			|| state() == torrent_status::checking_resume_data)
			return;

		std::vector<piece_index_t> pieces;
		file_storage const& fs = torrent_file().layout();
		for (file_index_t const file : files)
		{
			if (file < file_index_t{0} || file >= fs.end_file()) continue;
			if (fs.pad_file_at(file) || fs.file_size(file) == 0) continue;

			piece_index_t const first = torrent_file().map_file(file, 0, 1).piece;
			piece_index_t const last = torrent_file().map_file(
				file, fs.file_size(file) - 1, 1).piece;

			for (piece_index_t p = first; p <= last; ++p)
				if (have_piece(p)) pieces.push_back(p);
		}

		std::sort(pieces.begin(), pieces.end());
		pieces.erase(std::unique(pieces.begin(), pieces.end()), pieces.end());
		if (pieces.empty()) return;

		disk_job_flags_t flags = disk_interface::sequential_access
			| disk_interface::volatile_read | disk_interface::flush_piece;
		if (torrent_file().info_hashes().has_v1() && !m_disable_v1_hashes)
			flags |= disk_interface::v1_hash;

		std::uint8_t const gen = m_picker_generation;
		for (piece_index_t const piece : pieces)
		{
			aux::vector<sha256_hash> hashes;
			if (torrent_file().info_hashes().has_v2())
				hashes.resize(torrent_file().layout().blocks_in_piece2(piece));

			span<sha256_hash> v2_span(hashes);
			m_ses.disk_thread().async_hash(m_storage, piece, v2_span, flags,
				[self = shared_from_this(), hashes1 = std::move(hashes), gen](
					piece_index_t const p, sha1_hash const& h,
					storage_error const& error) mutable
				{
					if (self->m_abort || self->m_deleted
						|| gen != self->m_picker_generation)
						return;

					if (error)
					{
						if (error.ec == boost::system::errc::no_such_file_or_directory
							|| error.ec == boost::asio::error::eof
							|| error.ec == lt::errors::file_too_short)
							self->partfile_read_failed(p);
						else
							self->handle_disk_error("selective_recheck", error);
						return;
					}

					if (self->settings().get_bool(settings_pack::disable_hash_checks))
						return;

					boost::tribool v1_passed = boost::indeterminate;
					boost::tribool v2_passed = boost::indeterminate;
					if (self->torrent_file().info_hashes().has_v1()
						&& !self->m_disable_v1_hashes)
						v1_passed = h == self->torrent_file().hash_for_piece(p);

					if (self->torrent_file().info_hashes().has_v2()
						&& !bool(v1_passed == false))
						v2_passed = self->on_blocks_hashed(p, hashes1);

					if ((v1_passed && !v2_passed) || (!v1_passed && v2_passed))
					{
						self->handle_inconsistent_hashes(p);
						return;
					}

					if (bool(v1_passed == false) || bool(v2_passed == false))
						self->partfile_read_failed(p);
				});
		}
		m_ses.deferred_submit_jobs();
	}
'''
          replace_once(
              "src/torrent_handle.cpp",
              "\tvoid torrent_handle::force_recheck() const\n\t{\n\t\tasync_call(&aux::torrent::force_recheck);\n\t}\n\n\tvoid torrent_handle::resume() const",
              "\tvoid torrent_handle::force_recheck() const\n\t{\n\t\tasync_call(&aux::torrent::force_recheck);\n\t}\n" + implementation + "\n\tvoid torrent_handle::resume() const"
          )

          replace_once(
              "src/torrent.cpp",
              "\t\t// if we have all pieces we should not have a picker\n"
              "\t\t// unless we're in suggest mode\n"
              "\t\tTORRENT_ASSERT(!m_have_all\n"
              "\t\t\t|| settings().get_int(settings_pack::suggest_mode)\n"
              "\t\t\t== settings_pack::suggest_read_cache);",
              "\t\t// m_have_all may be materialized into a picker temporarily when a\n"
              "\t\t// previously-owned piece must be invalidated (e.g. selective recheck).\n"
              "\t\t// pp->we_have_all() below preserves every unrelated piece."
          )
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add include/libtorrent/torrent_handle.hpp include/libtorrent/aux_/torrent.hpp src/torrent_handle.cpp src/torrent.cpp
          git diff --cached --check
          git commit -m "feat: add selective file recheck [skip ci]"
          git push origin HEAD:feature/selective-file-recheck-stage2
