name: Selective recheck state refresh

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.number == 33 &&
      github.event.comment.body == '/apply-selective-state-refresh'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/selective-recheck-crash
          fetch-depth: 0

      - name: Add state notification after successful promotion
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/torrent_handle.cpp')
          text = path.read_text(encoding='utf-8')
          old = '''\t\t\t\t\t\t\tself->we_have(p);\n\t\t\t\t\t\t\tself->update_peer_interest(was_finished);\n\t\t\t\t\t\t\tself->update_want_peers();'''
          new = '''\t\t\t\t\t\t\tself->we_have(p);\n\t\t\t\t\t\t\tself->update_peer_interest(was_finished);\n\t\t\t\t\t\t\tself->state_updated();\n\t\t\t\t\t\t\tself->update_want_peers();'''
          if old not in text:
              raise SystemExit('expected selective recheck promotion block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Commit and push
        run: |
          git config user.name "marcmy"
          git config user.email "21000174+marcmy@users.noreply.github.com"
          git add src/torrent_handle.cpp
          git commit -m "fix: publish selective recheck piece promotions"
          git push origin HEAD:fix/selective-recheck-crash
