name: Benchmark (manual)

on:
   workflow_dispatch:

concurrency:
   group: ${{ github.ref }}-${{ github.workflow }}-${{ github.event_name }}
   cancel-in-progress: true

jobs:

   # Tracks benchmark history for the base branches themselves. Forks without
   # Bencher credentials still build the benchmark tools but skip reporting.
   tools:
      name: tools
      runs-on: ubuntu-24.04
      permissions:
         contents: read
         checks: write
      env:
         BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}

      steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
           submodules: recursive
           fetch-depth: 1
           filter: tree:0

      - name: update package lists
        continue-on-error: true
        run: |
          sudo apt update

      - uses: Chocobo1/setup-ccache-action@v1
        with:
          update_packager_index: false
          override_cache_key: ccache-linux-benchmark-tools-${{ github.base_ref || github.ref_name }}
          ccache_options: |
            max_size=500M

      - name: install boost
        run: |
          sudo apt install libboost-tools-dev libboost-dev libboost-system-dev
          echo "using gcc ;" >>~/user-config.jam

      - name: build benchmark tools
        run: |
          cd tools
          b2 release warnings-as-errors=on stage

      - uses: bencherdev/bencher@v0.6.11

      - name: Skip benchmark tracking when unconfigured
        if: env.BENCHER_API_KEY == ''
        run: echo "::notice::BENCHER_API_KEY is not configured; skipping Bencher reporting."

      - name: track benchmarks
        if: env.BENCHER_API_KEY != ''
        env:
          GITHUB_ACTIONS_TOKEN: ${{ github.token }}
        run: |
          cd tools
          bencher run \
            --project libtorrent \
            --key "$BENCHER_API_KEY" \
            --branch '${{ github.ref_name }}' \
            --testbed ubuntu-24.04 \
            --adapter json \
            --error-on-alert \
            --github-actions "$GITHUB_ACTIONS_TOKEN" \
            ./bencher
