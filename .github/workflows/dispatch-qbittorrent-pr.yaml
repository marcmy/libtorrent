name: Dispatch qBittorrent after libtorrent PR

on:
  workflow_run:
    workflows:
      - Custom Windows Fast Build
    types:
      - completed

permissions: {}

jobs:
  dispatch:
    name: Trigger qBittorrent PR validation
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: qbittorrent-sync
    permissions: {}

    steps:
      - name: Dispatch exact libtorrent PR revision
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.QBITTORRENT_SYNC_TOKEN }}
          repository: marcmy/qBittorrent
          event-type: libtorrent-pr-build
          client-payload: >-
            {"libtorrent_sha":"${{ github.event.workflow_run.head_sha }}","libtorrent_changed":"true"}
