name: Sync upstream chain

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Mirror and merge libtorrent RC_2_1
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      mirror_changed: ${{ steps.mirror.outputs.changed }}
      head_sha: ${{ steps.sync.outputs.head_sha }}

    steps:
      - name: Check out custom libtorrent branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: custom/qbittorrent-2.1
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          persist-credentials: true

      - name: Fetch source and mirror branches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add source https://github.com/arvidn/libtorrent.git
          git fetch --prune --no-tags source RC_2_1
          git fetch --no-tags origin \
            +refs/heads/upstream/RC_2_1:refs/remotes/origin/upstream/RC_2_1

      - name: Update pristine upstream mirror
        id: mirror
        shell: bash
        run: |
          set -euo pipefail

          source_sha="$(git rev-parse source/RC_2_1)"
          mirror_sha="$(git rev-parse origin/upstream/RC_2_1)"

          if [[ "$source_sha" == "$mirror_sha" ]]; then
            echo "upstream/RC_2_1 already matches arvidn/libtorrent:RC_2_1."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git push \
              --force-with-lease="refs/heads/upstream/RC_2_1:$mirror_sha" \
              origin \
              source/RC_2_1:refs/heads/upstream/RC_2_1
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

          echo "head_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Merge mirror into custom branch
        id: sync
        shell: bash
        run: |
          set -euo pipefail

          if git merge-base --is-ancestor source/RC_2_1 HEAD; then
            echo "custom/qbittorrent-2.1 already contains current upstream RC_2_1."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            if ! git merge --no-edit source/RC_2_1; then
              mapfile -t conflicts < <(git diff --name-only --diff-filter=U)

              if (( ${#conflicts[@]} != 1 )) || \
                [[ "${conflicts[0]:-}" != ".github/workflows/linux.yml" ]]; then
                echo "Unexpected upstream merge conflict(s):" >&2
                printf '  %s\n' "${conflicts[@]}" >&2
                git merge --abort
                exit 1
              fi

              echo "Preserving the fork's intentionally disabled Linux workflow."
              git checkout --ours -- .github/workflows/linux.yml
              git add .github/workflows/linux.yml
              git commit --no-edit
            fi

            git push origin HEAD:refs/heads/custom/qbittorrent-2.1
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Summarize libtorrent sync
        env:
          MIRROR_CHANGED: ${{ steps.mirror.outputs.changed }}
          MIRROR_HEAD: ${{ steps.mirror.outputs.head_sha }}
          CUSTOM_CHANGED: ${{ steps.sync.outputs.changed }}
          CUSTOM_HEAD: ${{ steps.sync.outputs.head_sha }}
        run: |
          {
            echo "## libtorrent upstream sync"
            echo "- Mirror changed: $MIRROR_CHANGED"
            echo "- Mirror head: $MIRROR_HEAD"
            echo "- Custom branch changed: $CUSTOM_CHANGED"
            echo "- Custom head: $CUSTOM_HEAD"
          } >> "$GITHUB_STEP_SUMMARY"

  dispatch-qbittorrent:
    name: Trigger qBittorrent upstream sync
    needs: sync
    runs-on: ubuntu-latest
    environment: qbittorrent-sync
    permissions: {}

    steps:
      - name: Dispatch qBittorrent sync
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.QBITTORRENT_SYNC_TOKEN }}
          repository: marcmy/qBittorrent
          event-type: libtorrent-upstream-synced
          client-payload: >-
            {"libtorrent_sha":"${{ needs.sync.outputs.head_sha }}","libtorrent_changed":"${{ needs.sync.outputs.changed }}"}
