name: Apply Default pread partfile recovery fix v2

on:
  push:
    branches:
      - custom/qbittorrent-2.1
    paths:
      - .github/workflows/apply-pread-partfile-recovery-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: custom/qbittorrent-2.1
          fetch-depth: 0

      - name: Apply focused pread recovery patch
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f"{path}: expected one match, found {n}\n--- anchor ---\n{old}")
              p.write_text(s.replace(old, new, 1))

          def replace_first(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"{path}: anchor not found\n--- anchor ---\n{old}")
              p.write_text(s.replace(old, new, 1))

          replace_once(
              "include/libtorrent/aux_/pread_storage.hpp",
              "\t\tbool v1() const { return m_v1; }\n\t\tbool v2() const { return m_v2; }\n\n\t\t// SHA-256 block hashes deposited by the v2 hash queue",
              "\t\tbool v1() const { return m_v1; }\n\t\tbool v2() const { return m_v2; }\n\n\t\t// A v1 piece whose skipped-file bytes disappeared from the part file.\n\t\t// pread_disk_io keeps this active while recovery writes are flushed and\n\t\t// verifies the piece from backing storage instead of the write cache.\n\t\tbool partfile_repair(piece_index_t piece) const;\n\t\tvoid set_partfile_repair(piece_index_t piece, bool enabled);\n\n\t\t// SHA-256 block hashes deposited by the v2 hash queue")

          replace_once(
              "include/libtorrent/aux_/pread_storage.hpp",
              "\t\t// used for skipped files\n\t\tstd::unique_ptr<part_file> m_part_file;\n\n\t\t// this is a bitfield with one bit per file.",
              "\t\t// used for skipped files\n\t\tstd::unique_ptr<part_file> m_part_file;\n\n\t\tmutable std::mutex m_partfile_repair_mutex;\n\t\taux::vector<bool, piece_index_t> m_partfile_repair;\n\n\t\t// this is a bitfield with one bit per file.")

          replace_once(
              "src/pread_storage.cpp",
              "\tvoid pread_storage::need_partfile()\n\t{\n\t\tif (m_part_file) return;\n\n\t\tm_part_file = std::make_unique<part_file>(\n\t\t\tm_part_file_dir.empty() ? m_save_path : combine_path(m_save_path, m_part_file_dir)\n\t\t\t, m_part_file_name\n\t\t\t, files().num_pieces(), files().piece_length());\n\t}\n\n\tvoid pread_storage::set_file_priority",
              "\tvoid pread_storage::need_partfile()\n\t{\n\t\tif (m_part_file) return;\n\n\t\tm_part_file = std::make_unique<part_file>(\n\t\t\tm_part_file_dir.empty() ? m_save_path : combine_path(m_save_path, m_part_file_dir)\n\t\t\t, m_part_file_name\n\t\t\t, files().num_pieces(), files().piece_length());\n\t}\n\n\tbool pread_storage::partfile_repair(piece_index_t const piece) const\n\t{\n\t\tstd::lock_guard<std::mutex> l(m_partfile_repair_mutex);\n\t\tif (m_partfile_repair.empty()) return false;\n\t\treturn m_partfile_repair[piece];\n\t}\n\n\tvoid pread_storage::set_partfile_repair(piece_index_t const piece, bool const enabled)\n\t{\n\t\tstd::lock_guard<std::mutex> l(m_partfile_repair_mutex);\n\t\tif (m_partfile_repair.empty())\n\t\t\tm_partfile_repair.resize(files().num_pieces(), false);\n\t\tm_partfile_repair[piece] = enabled;\n\t}\n\n\tvoid pread_storage::set_file_priority")

          replace_once(
              "src/pread_storage.cpp",
              "\t\t\t, [this, mode, flags, &sett](file_index_t const file_index\n\t\t\t\t, std::int64_t const file_offset\n\t\t\t\t, span<char> buf, storage_error& ec)",
              "\t\t\t, [this, piece, mode, flags, &sett](file_index_t const file_index\n\t\t\t\t, std::int64_t const file_offset\n\t\t\t\t, span<char> buf, storage_error& ec)")

          replace_once(
              "src/pread_storage.cpp",
              "\t\t\t\tint const ret = m_part_file->read(buf, map.piece, map.start, e);\n\n\t\t\t\tif (e)\n\t\t\t\t{\n\t\t\t\t\tec.ec = e;\n\t\t\t\t\tec.file(file_index);\n\t\t\t\t\tec.operation = operation_t::partfile_read;\n\t\t\t\t\treturn -1;\n\t\t\t\t}",
              "\t\t\t\tint const ret = m_part_file->read(buf, map.piece, map.start, e);\n\n\t\t\t\tif (e)\n\t\t\t\t{\n\t\t\t\t\tif ((flags & disk_interface::v1_hash)\n\t\t\t\t\t\t&& (e == boost::system::errc::no_such_file_or_directory\n\t\t\t\t\t\t\t|| e == boost::asio::error::eof\n\t\t\t\t\t\t\t|| e == lt::errors::file_too_short))\n\t\t\t\t\t\tset_partfile_repair(piece, true);\n\n\t\t\t\t\tec.ec = e;\n\t\t\t\t\tec.file(file_index);\n\t\t\t\t\tec.operation = operation_t::partfile_read;\n\t\t\t\t\treturn -1;\n\t\t\t\t}")

          replace_once(
              "src/pread_storage.cpp",
              "\t\t\t, [this, mode, &sett, write_mode](file_index_t const file_index\n\t\t\t\t, std::int64_t const file_offset\n\t\t\t\t, span<span<char const> const> const bufs, storage_error& ec)",
              "\t\t\t, [this, piece, mode, &sett, write_mode](file_index_t const file_index\n\t\t\t\t, std::int64_t const file_offset\n\t\t\t\t, span<span<char const> const> const bufs, storage_error& ec)")

          branch = "\t\t\t\treturn ret;\n\t\t\t}\n\n\t\t\t// invalidate our stat cache for this file, since\n\t\t\t// we're writing to it\n\t\t\tm_stat_cache.set_dirty(file_index);"
          replace_first(
              "src/pread_storage.cpp",
              branch,
              "\t\t\t\treturn ret;\n\t\t\t}\n\n\t\t\tif (partfile_repair(piece))\n\t\t\t\treturn bufs_size(bufs);\n\n\t\t\t// invalidate our stat cache for this file, since\n\t\t\t// we're writing to it\n\t\t\tm_stat_cache.set_dirty(file_index);")

          replace_once(
              "src/pread_storage.cpp",
              "\t\t\t, [this, mode, &sett, write_mode](file_index_t const file_index\n\t\t\t\t, std::int64_t const file_offset\n\t\t\t\t, span<char const> buf, storage_error& ec)",
              "\t\t\t, [this, piece, mode, &sett, write_mode](file_index_t const file_index\n\t\t\t\t, std::int64_t const file_offset\n\t\t\t\t, span<char const> buf, storage_error& ec)")

          replace_first(
              "src/pread_storage.cpp",
              branch,
              "\t\t\t\treturn ret;\n\t\t\t}\n\n\t\t\tif (partfile_repair(piece))\n\t\t\t\treturn int(buf.size());\n\n\t\t\t// invalidate our stat cache for this file, since\n\t\t\t// we're writing to it\n\t\t\tm_stat_cache.set_dirty(file_index);")

          replace_once(
              "src/pread_storage.cpp",
              "\t\t\t\tint const ret = m_part_file->hash(ph, buf.size()\n\t\t\t\t\t, map.piece, map.start, e);\n\n\t\t\t\tif (e)\n\t\t\t\t{\n\t\t\t\t\tec.ec = e;\n\t\t\t\t\tec.file(file_index);\n\t\t\t\t\tec.operation = operation_t::partfile_read;\n\t\t\t\t}",
              "\t\t\t\tint const ret = m_part_file->hash(ph, buf.size()\n\t\t\t\t\t, map.piece, map.start, e);\n\n\t\t\t\tif (e)\n\t\t\t\t{\n\t\t\t\t\tif (e == boost::system::errc::no_such_file_or_directory\n\t\t\t\t\t\t|| e == boost::asio::error::eof\n\t\t\t\t\t\t|| e == lt::errors::file_too_short)\n\t\t\t\t\t\tset_partfile_repair(piece, true);\n\n\t\t\t\t\tec.ec = e;\n\t\t\t\t\tec.file(file_index);\n\t\t\t\t\tec.operation = operation_t::partfile_read;\n\t\t\t\t}")

          replace_once(
              "src/pread_disk_io.cpp",
              "\taux::pread_disk_job* j = m_job_pool.allocate_job<aux::job::hash>(\n\t\tflags,\n\t\tm_torrents[storage]->shared_from_this(),\n\t\tstd::move(handler),\n\t\tpiece,\n\t\tv2,\n\t\tsha1_hash{}\n\t);\n\n\taux::disk_cache::hash_result const ret = m_cache.try_hash_piece({j->storage->storage_index(), piece}, j);",
              "\taux::pread_disk_job* j = m_job_pool.allocate_job<aux::job::hash>(\n\t\tflags,\n\t\tm_torrents[storage]->shared_from_this(),\n\t\tstd::move(handler),\n\t\tpiece,\n\t\tv2,\n\t\tsha1_hash{}\n\t);\n\n\tif ((flags & disk_interface::v1_hash) && j->storage->partfile_repair(piece))\n\t{\n\t\tadd_fence_job(j);\n\t\treturn;\n\t}\n\n\taux::disk_cache::hash_result const ret = m_cache.try_hash_piece({j->storage->storage_index(), piece}, j);")

          replace_once(
              "src/pread_disk_io.cpp",
              "\tint const blocks_to_read = std::max(blocks_in_piece, blocks_in_piece2);\n\n\t// async_hash's fast path may have partially populated a.block_hashes",
              "\tint const blocks_to_read = std::max(blocks_in_piece, blocks_in_piece2);\n\n\tif (v1 && j->storage->partfile_repair(a.piece))\n\t{\n\t\ttime_point const start_time = clock_type::now();\n\t\tstd::unique_ptr<char[]> buf(new char[std::size_t(piece_size)]);\n\t\tspan<char> const buf_span{buf.get(), piece_size};\n\n\t\tj->error.ec.clear();\n\t\tint const read_ret = j->storage->read(m_settings, buf_span, a.piece, 0\n\t\t\t, file_mode, j->flags, j->error);\n\n\t\tif (!j->error.ec && read_ret == piece_size)\n\t\t{\n\t\t\thasher h;\n\t\t\th.update(buf_span);\n\t\t\ta.piece_hash = h.final();\n\n\t\t\tif (v2)\n\t\t\t{\n\t\t\t\thasher256 h2;\n\t\t\t\tint offset = 0;\n\t\t\t\tfor (int i = 0; i < blocks_in_piece2; ++i)\n\t\t\t\t{\n\t\t\t\t\tstd::ptrdiff_t const len2 = std::min(default_block_size, piece_size2 - offset);\n\t\t\t\t\th2.reset();\n\t\t\t\t\th2.update({buf.get() + offset, len2});\n\t\t\t\t\ta.block_hashes[i] = h2.final();\n\t\t\t\t\toffset += default_block_size;\n\t\t\t\t}\n\t\t\t}\n\n\t\t\tj->storage->drop_precomputed_v2(a.piece);\n\t\t\tj->storage->set_partfile_repair(a.piece, false);\n\n\t\t\tstd::int64_t const read_time = total_microseconds(clock_type::now() - start_time);\n\t\t\tm_stats_counters.inc_stats_counter(counters::num_read_back, blocks_to_read);\n\t\t\tm_stats_counters.inc_stats_counter(counters::num_read_ops, 1);\n\t\t\tm_stats_counters.inc_stats_counter(counters::disk_hash_time, read_time);\n\t\t\tm_stats_counters.inc_stats_counter(counters::disk_job_time, read_time);\n\t\t\treturn {};\n\t\t}\n\n\t\tif (!j->error.ec)\n\t\t{\n\t\t\tj->error.ec = boost::asio::error::eof;\n\t\t\tj->error.operation = operation_t::file_read;\n\t\t}\n\t\treturn disk_status::fatal_disk_error;\n\t}\n\n\t// async_hash's fast path may have partially populated a.block_hashes")

          for workflow in [
              ".github/workflows/apply-pread-partfile-recovery.yml",
              ".github/workflows/apply-pread-partfile-recovery-v2.yml",
          ]:
              Path(workflow).unlink(missing_ok=True)

      - name: Show patch
        run: git diff --check && git diff --stat && git diff

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix part-file recovery on default pread disk I/O"
          git push origin HEAD:custom/qbittorrent-2.1
