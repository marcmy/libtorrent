name: Custom Windows Fast Build

on:
  push:
    branches:
      - custom/qbittorrent-2.1
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "bindings/python/**"
  pull_request:
    branches:
      - custom/qbittorrent-2.1
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "bindings/python/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: custom-windows-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build custom libtorrent (x64)
    runs-on: windows-latest
    permissions:
      contents: read
      actions: write

    defaults:
      run:
        shell: pwsh

    env:
      boost_path: "${{ github.workspace }}/../boost"
      vcpkg_path: "c:/vcpkg"
      target_arch: "x64"
      vcpkg_triplet: "x64-windows-static-md-release"
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"

    steps:
      - name: Checkout libtorrent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 1

      - name: Setup devcmd
        uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9 # v4.1.0
        with:
          arch: ${{ env.target_arch }}

      - name: Install Ninja
        run: |
          if ((Get-Command "ninja.exe" -ErrorAction SilentlyContinue) -eq $null)
          {
            choco install ninja
          }
          ninja --version

      - name: Set variables for GitHub Actions caches
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', (process.env.ACTIONS_CACHE_URL || ''));
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', (process.env.ACTIONS_RUNTIME_TOKEN || ''));

      - name: Install sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
        with:
          version: "v0.17.0"

      - name: Configure vcpkg triplet
        run: |
          New-Item `
            -Force `
            -ItemType File `
            -Path "${{ env.vcpkg_path }}/triplets_overlay/${{ env.vcpkg_triplet }}.cmake"
          Add-Content `
            -Path "${{ env.vcpkg_path }}/triplets_overlay/${{ env.vcpkg_triplet }}.cmake" `
            -Value @("set(VCPKG_TARGET_ARCHITECTURE ${{ env.target_arch }})",
              "set(VCPKG_LIBRARY_LINKAGE static)",
              "set(VCPKG_CRT_LINKAGE dynamic)",
              "set(VCPKG_BUILD_TYPE release)")

          $packages = `
            "boost-build:${{ env.vcpkg_triplet }}",
            "openssl:${{ env.vcpkg_triplet }}",
            "zlib:${{ env.vcpkg_triplet }}"
          ${{ env.vcpkg_path }}/vcpkg.exe install `
            --binarysource="clear;x-gha,readwrite" `
            --clean-after-build `
            --overlay-triplets="${{ env.vcpkg_path }}/triplets_overlay" `
            $packages

      - name: Cache Boost headers
        id: boost-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.boost_path }}
          key: boost-windows-msvc-1.91.0

      - name: Install Boost headers
        if: steps.boost-cache.outputs.cache-hit != 'true'
        env:
          boost_version: "1.91.0"
          boost_archive_version: "1_91_0"
        run: |
          $boostUrl = "https://archives.boost.io/release/${{ env.boost_version }}/source/boost_${{ env.boost_archive_version }}.tar.gz"
          $fallbackUrl = "https://sourceforge.net/projects/boost/files/boost/${{ env.boost_version }}/boost_${{ env.boost_archive_version }}.tar.gz"
          curl -L -o "${{ runner.temp }}/boost.tar.gz" "$boostUrl"
          tar -xf "${{ runner.temp }}/boost.tar.gz" -C "${{ github.workspace }}/.."
          if ($LastExitCode -ne 0)
          {
            curl -L -o "${{ runner.temp }}/boost.tar.gz" "$fallbackUrl"
            tar -xf "${{ runner.temp }}/boost.tar.gz" -C "${{ github.workspace }}/.."
          }
          move "${{ github.workspace }}/../boost_*" "${{ env.boost_path }}"
          cd "${{ env.boost_path }}"
          ${{ env.vcpkg_path }}/installed/${{ env.vcpkg_triplet }}/tools/boost-build/b2.exe `
            stage `
            toolset=msvc `
            --stagedir=.\ `
            --with-headers

      - name: Configure
        run: |
          $env:CFLAGS += " /guard:cf"
          $env:CXXFLAGS += " /guard:cf"
          $env:LDFLAGS += " /GUARD:CF"
          cmake `
            -B build `
            -G "Ninja" `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DCMAKE_CXX_STANDARD=20 `
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON `
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install" `
            -DCMAKE_TOOLCHAIN_FILE="${{ env.vcpkg_path }}/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded `
            -DCMAKE_POLICY_DEFAULT_CMP0141=NEW `
            -DBOOST_ROOT="${{ env.boost_path }}/lib/cmake" `
            -DBUILD_SHARED_LIBS=OFF `
            -Dbuild_tools=ON `
            -Ddeprecated-functions=OFF `
            -Dstatic_runtime=OFF `
            -DVCPKG_TARGET_TRIPLET=${{ env.vcpkg_triplet }} `
            -Dwebtorrent=ON

      - name: Build and install
        run: |
          cmake --build build --target torrent-rasterbar --parallel
          cmake --build build --target checking_benchmark checking_io_benchmark --parallel
          cmake --install build

      - name: Stress real WOF/LZX multi-file force recheck
        if: github.event_name == 'pull_request' && github.head_ref == 'diag/wof-production-recheck'
        run: |
          $fixture = Join-Path $env:SystemDrive "wof-production-recheck-$env:GITHUB_RUN_ID"
          $probeDir = Join-Path $env:SystemDrive "wof-capability-probe-$env:GITHUB_RUN_ID"

          try
          {
            $volume = Get-Volume -DriveLetter $env:SystemDrive.TrimEnd(':')
            $volume | Format-List DriveLetter, FileSystem, Size, SizeRemaining
            if ($volume.FileSystem -ne 'NTFS')
            {
              throw "system volume is not NTFS"
            }
            if ($volume.SizeRemaining -lt 6GB)
            {
              throw "system volume does not have enough free space for the >4 GiB WOF fixture"
            }

            New-Item -ItemType Directory -Force -Path $probeDir | Out-Null
            $probe = Join-Path $probeDir "probe.bin"
            [System.IO.File]::WriteAllBytes($probe, [byte[]]::new(1048576))
            compact.exe /C /F /EXE:LZX $probe
            if ($LASTEXITCODE -ne 0)
            {
              throw "system volume does not support WOF/LZX compression"
            }
            Remove-Item $probeDir -Recurse -Force

            python .github/scripts/create-wof-test-fixture.py --output $fixture
            if ($LASTEXITCODE -ne 0) { throw "failed to create base WOF test fixture" }

            $dataRoot = Join-Path $fixture "payload"
            $largeWof = Join-Path $dataRoot "bulk\large-wof.bin"
            $mediumWof = Join-Path $dataRoot "bulk\medium-wof.bin"
            $prefixPlain = Join-Path $dataRoot "edge\prefix.bin"
            $betweenPlain = Join-Path $dataRoot "edge\between.bin"
            $tailPlain = Join-Path $dataRoot "plain\tail.bin"
            $torrent = Join-Path $fixture "payload.torrent"

            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $largeWof) | Out-Null
            Move-Item (Join-Path $fixture "payload.bin") $largeWof

            $sources = @(
              @{ path = $prefixPlain; size = 32891; dir = (Join-Path $fixture "src-prefix") },
              @{ path = $betweenPlain; size = 16391; dir = (Join-Path $fixture "src-between") },
              @{ path = $mediumWof; size = 50333993; dir = (Join-Path $fixture "src-medium") },
              @{ path = $tailPlain; size = 25220145; dir = (Join-Path $fixture "src-tail") }
            )
            foreach ($source in $sources)
            {
              python .github/scripts/create-wof-test-fixture.py --output $source.dir --size $source.size
              if ($LASTEXITCODE -ne 0) { throw "failed to create fixture member $($source.path)" }
              New-Item -ItemType Directory -Force -Path (Split-Path -Parent $source.path) | Out-Null
              Move-Item (Join-Path $source.dir "payload.bin") $source.path
              Remove-Item $source.dir -Recurse -Force
            }

            python .github/scripts/create-wof-multifile-torrent.py `
              --data-root $dataRoot `
              --torrent $torrent
            if ($LASTEXITCODE -ne 0) { throw "failed to create mixed multi-file torrent" }

            $wofFiles = @($largeWof, $mediumWof)
            foreach ($file in $wofFiles)
            {
              compact.exe /C /F /EXE:LZX $file
              if ($LASTEXITCODE -ne 0) { throw "compact.exe failed to apply LZX to $file" }
              compact.exe /Q $file
            }

            $typeDefinition = @(
              'using System;',
              'using System.Runtime.InteropServices;',
              'public static class WofProbe',
              '{',
              '    [DllImport("Wofutil.dll", CharSet = CharSet.Unicode)]',
              '    public static extern int WofIsExternalFile(',
              '        string path,',
              '        [MarshalAs(UnmanagedType.Bool)] out bool external,',
              '        out uint provider,',
              '        IntPtr externalFileInfo,',
              '        IntPtr bufferLength);',
              '}'
            ) -join "`r`n"
            Add-Type -TypeDefinition $typeDefinition

            foreach ($file in $wofFiles)
            {
              $external = $false
              [uint32]$provider = 0
              $hr = [WofProbe]::WofIsExternalFile(
                $file, [ref]$external, [ref]$provider, [IntPtr]::Zero, [IntPtr]::Zero)
              "WOF expected: file={0} hr=0x{1:X8} external={2} provider={3}" -f $file, ([uint32]$hr), $external, $provider
              if ($hr -lt 0 -or -not $external -or $provider -ne 2)
              {
                throw "fixture file is not backed by WOF_PROVIDER_FILE: $file"
              }
            }

            foreach ($file in @($prefixPlain, $betweenPlain, $tailPlain))
            {
              $external = $false
              [uint32]$provider = 0
              $hr = [WofProbe]::WofIsExternalFile(
                $file, [ref]$external, [ref]$provider, [IntPtr]::Zero, [IntPtr]::Zero)
              "WOF plain: file={0} hr=0x{1:X8} external={2} provider={3}" -f $file, ([uint32]$hr), $external, $provider
              if ($hr -lt 0 -or $external)
              {
                throw "plain fixture file unexpectedly reports as external WOF: $file"
              }
            }

            foreach ($backend in @('default', 'pread'))
            {
              "=== force-recheck backend: $backend ==="
              & .\build\tools\checking_benchmark.exe `
                --torrent $torrent `
                --save-path $fixture `
                --backend $backend `
                --hash-threads 4 `
                --aio-threads 10 `
                --checking-mib 128 `
                --runs 6 `
                --alert-timeout 120
              if ($LASTEXITCODE -ne 0)
              {
                throw "WOF/LZX multi-file recheck failed for backend $backend"
              }
            }
          }
          finally
          {
            Remove-Item $probeDir -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item $fixture -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Show sccache stats
        if: always()
        continue-on-error: true
        run: sccache --show-stats

      - name: Upload custom libtorrent
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libtorrent-custom-windows-x64-${{ github.sha }}
          path: |
            install
            build/compile_commands.json
            build/tools/checking_benchmark.exe
            build/tools/checking_benchmark.pdb
            build/tools/checking_io_benchmark.exe
            build/tools/checking_io_benchmark.pdb
            tools/run_checking_matrix.ps1

  dispatch-qbittorrent:
    name: Trigger qBittorrent build
    if: github.event_name == 'push' && needs.build.result == 'success'
    needs: build
    runs-on: ubuntu-latest
    environment: qbittorrent-sync
    permissions: {}

    steps:
      - name: Dispatch qBittorrent sync
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.QBITTORRENT_SYNC_TOKEN }}
          repository: marcmy/qBittorrent
          event-type: libtorrent-upstream-synced
          client-payload: >-
            {"libtorrent_sha":"${{ github.sha }}","libtorrent_changed":"true"}
