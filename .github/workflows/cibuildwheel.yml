name: cibuildwheel

permissions: read-all

# This fork only publishes/validates Windows wheels. Keep PR validation small,
# while workflow_dispatch and release tags build the full supported Windows set.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Write 'PUBLISH' to publish to pypi. BEWARE! ARTIFACTS ARE IMMUTABLE AND CANNOT BE REPLACED ONCE PUBLISHED!
      publish_test:
        description: Write 'PUBLISH_TEST' to publish to test-pypi. BEWARE! ARTIFACTS ARE IMMUTABLE AND CANNOT BE REPLACED ONCE PUBLISHED!

  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

  pull_request:
    paths:
      - .github/workflows/cibuildwheel.yml
      - bindings/python/__init__.pyi
      - tools/cibuildwheel/**
      - pyproject.toml

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  configure_matrix:
    runs-on: ubuntu-latest
    env:
      MATRIX_PULL_REQUEST: |
        {
          "include": [
            {"os": "windows-2022", "CIBW_BUILD": "cp39-win32", "CIBW_ARCHS_WINDOWS": "x86"},
            {"os": "windows-2022", "CIBW_BUILD": "cp39-win_amd64", "CIBW_ARCHS_WINDOWS": "AMD64"}
          ]
        }
      MATRIX_WORKFLOW_DISPATCH: |
        {
          "include": [
            {"os": "windows-2022", "CIBW_BUILD": "cp39-win32", "CIBW_ARCHS_WINDOWS": "x86"},
            {"os": "windows-2022", "CIBW_BUILD": "cp310-win32", "CIBW_ARCHS_WINDOWS": "x86"},
            {"os": "windows-2022", "CIBW_BUILD": "cp311-win32", "CIBW_ARCHS_WINDOWS": "x86"},
            {"os": "windows-2022", "CIBW_BUILD": "cp312-win32", "CIBW_ARCHS_WINDOWS": "x86"},
            {"os": "windows-2022", "CIBW_BUILD": "cp313-win32", "CIBW_ARCHS_WINDOWS": "x86"},
            {"os": "windows-2022", "CIBW_BUILD": "cp39-win_amd64", "CIBW_ARCHS_WINDOWS": "AMD64"},
            {"os": "windows-2022", "CIBW_BUILD": "cp310-win_amd64", "CIBW_ARCHS_WINDOWS": "AMD64"},
            {"os": "windows-2022", "CIBW_BUILD": "cp311-win_amd64", "CIBW_ARCHS_WINDOWS": "AMD64"},
            {"os": "windows-2022", "CIBW_BUILD": "cp312-win_amd64", "CIBW_ARCHS_WINDOWS": "AMD64"},
            {"os": "windows-2022", "CIBW_BUILD": "cp313-win_amd64", "CIBW_ARCHS_WINDOWS": "AMD64"}
          ]
        }

    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - id: set-matrix
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" == "pull_request" ]; then
            echo "matrix=$(echo "$MATRIX_PULL_REQUEST" | jq -c)" >> "$GITHUB_OUTPUT"
          else
            echo "matrix=$(echo "$MATRIX_WORKFLOW_DISPATCH" | jq -c)" >> "$GITHUB_OUTPUT"
          fi

  build_wheels:
    needs: configure_matrix
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.configure_matrix.outputs.matrix) }}

    env:
      CIBW_BUILD_VERBOSITY: 1
      CIBW_BUILD: ${{ matrix.CIBW_BUILD }}
      CIBW_ARCHS_WINDOWS: ${{ matrix.CIBW_ARCHS_WINDOWS }}
      CIBW_SKIP: pp*
      CIBW_TEST_SKIP: "*-win32"

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1
          filter: tree:0

      - name: patch libdatachannel (windows 32/64-bit builds)
        run: git apply ../patch-libdatachannel-32bit-builds.patch
        working-directory: deps/libdatachannel

      - uses: actions/cache@v5
        id: cache-wheel
        with:
          path: wheelhouse
          key: wheel-${{ matrix.os }}-${{ matrix.CIBW_BUILD }}

      - name: Install OpenSSL
        uses: ./.github/actions/win_install_openssl
        with:
          architecture: ${{ case(endsWith(matrix.CIBW_BUILD, 'win32'), 'x86', 'x64') }}
          linking: static

      - name: setup msbuild
        uses: microsoft/setup-msbuild@v3

      - uses: pypa/cibuildwheel@v2.23.4
        if: ${{ steps.cache-wheel.outputs.cache-hit != 'true' || github.event_name == 'pull_request' }}

      - uses: actions/upload-artifact@v7
        with:
          path: wheelhouse/*.whl
          name: wheels-${{ matrix.os }}-${{ matrix.CIBW_BUILD }}

  check_wheel_type_exposure:
    needs: build_wheels
    runs-on: windows-2022
    if: needs.build_wheels.result == 'success'

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-windows-2022-cp39-win_amd64
          path: wheelhouse
          merge-multiple: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.9'
          architecture: 'x64'

      - name: test wheel type issues
        shell: pwsh
        run: |
          python -m pip install --upgrade pip mypy
          $wheel = (Get-ChildItem wheelhouse\*.whl | Select-Object -First 1).FullName
          python -m pip install $wheel
          python -m mypy.stubtest libtorrent

  upload_pypi:
    needs: build_wheels
    runs-on: ubuntu-latest
    if: needs.build_wheels.result == 'success' && github.event.inputs.publish == 'PUBLISH'

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: wheelhouse
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: wheelhouse
          skip-existing: true

  upload_pypi_test:
    needs: build_wheels
    runs-on: ubuntu-latest
    if: needs.build_wheels.result == 'success' && github.event.inputs.publish_test == 'PUBLISH_TEST'

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: wheelhouse
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          packages-dir: wheelhouse
          skip-existing: true
          repository-url: https://test.pypi.org/legacy/

  upload_release:
    needs: build_wheels
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: wheelhouse
          merge-multiple: true

      - name: upload wheels to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          wheels=(wheelhouse/*.whl)
          if [ ${#wheels[@]} -eq 0 ]; then
            echo "no wheels were built successfully, nothing to upload"
            exit 0
          fi
          echo "uploading ${#wheels[@]} wheel(s)"
          gh release upload "$GITHUB_REF_NAME" "${wheels[@]}" \
            --clobber --repo "$GITHUB_REPOSITORY"
