name: cibuildwheel (manual)

permissions: read-all

# Windows wheel building/publishing is retained as an on-demand maintenance
# workflow, but it does not run automatically for this qBittorrent-focused fork.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Write 'PUBLISH' to publish to PyPI. BEWARE! ARTIFACTS ARE IMMUTABLE AND CANNOT BE REPLACED ONCE PUBLISHED!
      publish_test:
        description: Write 'PUBLISH_TEST' to publish to TestPyPI. BEWARE! ARTIFACTS ARE IMMUTABLE AND CANNOT BE REPLACED ONCE PUBLISHED!

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build_wheels:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            CIBW_BUILD: cp39-win32
            CIBW_ARCHS_WINDOWS: x86
          - os: windows-2022
            CIBW_BUILD: cp310-win32
            CIBW_ARCHS_WINDOWS: x86
          - os: windows-2022
            CIBW_BUILD: cp311-win32
            CIBW_ARCHS_WINDOWS: x86
          - os: windows-2022
            CIBW_BUILD: cp312-win32
            CIBW_ARCHS_WINDOWS: x86
          - os: windows-2022
            CIBW_BUILD: cp313-win32
            CIBW_ARCHS_WINDOWS: x86
          - os: windows-2022
            CIBW_BUILD: cp39-win_amd64
            CIBW_ARCHS_WINDOWS: AMD64
          - os: windows-2022
            CIBW_BUILD: cp310-win_amd64
            CIBW_ARCHS_WINDOWS: AMD64
          - os: windows-2022
            CIBW_BUILD: cp311-win_amd64
            CIBW_ARCHS_WINDOWS: AMD64
          - os: windows-2022
            CIBW_BUILD: cp312-win_amd64
            CIBW_ARCHS_WINDOWS: AMD64
          - os: windows-2022
            CIBW_BUILD: cp313-win_amd64
            CIBW_ARCHS_WINDOWS: AMD64

    env:
      CIBW_BUILD_VERBOSITY: 1
      CIBW_BUILD: ${{ matrix.CIBW_BUILD }}
      CIBW_ARCHS_WINDOWS: ${{ matrix.CIBW_ARCHS_WINDOWS }}
      CIBW_SKIP: pp*
      CIBW_TEST_SKIP: "*-win32"

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1
          filter: tree:0

      - name: patch libdatachannel (windows 32/64-bit builds)
        run: git apply ../patch-libdatachannel-32bit-builds.patch
        working-directory: deps/libdatachannel

      - uses: actions/cache@v6
        id: cache-wheel
        with:
          path: wheelhouse
          key: wheel-${{ matrix.os }}-${{ matrix.CIBW_BUILD }}

      - name: Install OpenSSL
        uses: ./.github/actions/win_install_openssl
        with:
          architecture: ${{ case(endsWith(matrix.CIBW_BUILD, 'win32'), 'x86', 'x64') }}
          linking: static

      - name: setup msbuild
        uses: microsoft/setup-msbuild@v3

      - uses: pypa/cibuildwheel@v2.23.4
        if: steps.cache-wheel.outputs.cache-hit != 'true'

      - uses: actions/upload-artifact@v7
        with:
          path: wheelhouse/*.whl
          name: wheels-${{ matrix.os }}-${{ matrix.CIBW_BUILD }}

  check_wheel_type_exposure:
    needs: build_wheels
    runs-on: windows-2022
    if: needs.build_wheels.result == 'success'

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-windows-2022-cp39-win_amd64
          path: wheelhouse
          merge-multiple: true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.9'
          architecture: 'x64'

      - name: test wheel type issues
        shell: pwsh
        run: |
          python -m pip install --upgrade pip mypy
          $wheel = (Get-ChildItem wheelhouse\*.whl | Select-Object -First 1).FullName
          python -m pip install $wheel
          python -m mypy.stubtest libtorrent

  upload_pypi:
    needs: build_wheels
    runs-on: ubuntu-latest
    if: needs.build_wheels.result == 'success' && github.event.inputs.publish == 'PUBLISH'

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: wheelhouse
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: wheelhouse
          skip-existing: true

  upload_pypi_test:
    needs: build_wheels
    runs-on: ubuntu-latest
    if: needs.build_wheels.result == 'success' && github.event.inputs.publish_test == 'PUBLISH_TEST'

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: wheelhouse
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          packages-dir: wheelhouse
          skip-existing: true
          repository-url: https://test.pypi.org/legacy/
