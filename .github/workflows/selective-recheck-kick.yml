name: Selective recheck staging trigger

on:
  pull_request_target:
    branches:
      - custom/qbittorrent-2.1
    types: [opened]

permissions:
  contents: write

jobs:
  kick:
    if: github.event.pull_request.head.ref == 'feature/selective-file-recheck' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/selective-file-recheck
      - name: Trigger staging helper
        run: |
          printf '\n# actions-trigger\n' >> .github/selective-file-recheck.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/selective-file-recheck.patch
          git commit -m "chore: trigger selective recheck staging"
          git push origin HEAD:feature/selective-file-recheck
