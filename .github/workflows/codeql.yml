name: "CodeQL"

on:
  workflow_dispatch:
  push:
    branches: [ custom/qbittorrent-2.1, master ]
  pull_request:
  schedule:
    - cron: "3 12 * * 2"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ cpp, python, actions ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1
          filter: tree:0

      # No-build mode lets CodeQL honor paths-ignore for C/C++, so vendored
      # sources under deps/** are not treated as first-party findings.
      - name: Initialize CodeQL (cpp)
        if: ${{ matrix.language == 'cpp' }}
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: +security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      - name: Initialize CodeQL
        if: ${{ matrix.language != 'cpp' }}
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
