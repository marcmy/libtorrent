name: Apply recoverable part-file alert suppression

on:
  push:
    branches:
      - custom/qbittorrent-2.1
    paths:
      - .github/workflows/apply-recoverable-partfile-alert-suppression.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: custom/qbittorrent-2.1
          fetch-depth: 0

      - name: Patch peer read error handling
        run: python3 .github/scripts/apply-recoverable-partfile-alert-suppression.py

      - name: Validate focused diff
        run: git diff --check

      - name: Commit source change and remove one-shot helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-recoverable-partfile-alert-suppression.yml \
                 .github/scripts/apply-recoverable-partfile-alert-suppression.py
          git add src/peer_connection.cpp
          git commit -m "Suppress recoverable part-file read alerts"
          git push origin HEAD:custom/qbittorrent-2.1
