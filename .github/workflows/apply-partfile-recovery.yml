name: Apply partfile recovery patch

on:
  push:
    branches:
      - custom/qbittorrent-2.1
    paths:
      - .github/workflows/apply-partfile-recovery.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout custom branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: custom/qbittorrent-2.1
          fetch-depth: 0

      - name: Apply focused partfile recovery patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if text.count(old) != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {text.count(old)}")
              return text.replace(old, new, 1)

          # ---- mmap_storage.hpp -------------------------------------------------
          path = Path("include/libtorrent/aux_/mmap_storage.hpp")
          text = path.read_text()

          text = replace_once(text,
              "\t\tvoid need_partfile();\n\n\t\trenamed_files m_renamed_files;",
              "\t\tvoid need_partfile();\n\t\tbool partfile_repair(piece_index_t piece) const;\n\t\tvoid set_partfile_repair(piece_index_t piece, bool enabled);\n\n\t\trenamed_files m_renamed_files;",
              "declare partfile recovery helpers")

          text = replace_once(text,
              "\t\t// used for skipped files\n\t\tstd::unique_ptr<part_file> m_part_file;",
              "\t\t// used for skipped files\n\t\tstd::unique_ptr<part_file> m_part_file;\n\n"
              "\t\t// A missing part-file range discovered while hashing means the\n"
              "\t\t// piece cannot be verified, not that the wanted-file bytes are bad.\n"
              "\t\t// Keep those pieces in a one-shot recovery mode: their next download\n"
              "\t\t// only rebuilds skipped-file data in the part file.\n"
              "\t\tmutable std::mutex m_partfile_repair_mutex;\n"
              "\t\taux::vector<bool, piece_index_t> m_partfile_repair;",
              "add partfile recovery state")

          path.write_text(text)

          # ---- mmap_storage.cpp -------------------------------------------------
          path = Path("src/mmap_storage.cpp")
          text = path.read_text()

          # Remove the failed WOF/mmap experiment completely.
          text = replace_once(text,
              "#ifdef TORRENT_WINDOWS\n"
              "#include \"libtorrent/aux_/win_util.hpp\"\n"
              "#ifndef WIN32_LEAN_AND_MEAN\n"
              "#define WIN32_LEAN_AND_MEAN\n"
              "#endif\n"
              "#include <windows.h>\n"
              "#endif\n\n",
              "",
              "remove WOF Windows includes")

          text = replace_once(text,
              "#ifdef TORRENT_WINDOWS\n"
              "struct wofutil\n"
              "{\n"
              "\tstatic constexpr char const* library_name = \"Wofutil.dll\";\n"
              "};\n\n"
              "// WOF_PROVIDER_FILE from the Windows SDK. Keep this local so detecting WOF\n"
              "// remains runtime-only and does not require wofapi.h on older SDK targets.\n"
              "constexpr ULONG wof_provider_file = 0x00000002;\n\n"
              "bool is_wof_file_provider(std::string const& path)\n"
              "{\n"
              "\tusing wof_is_external_file_t = HRESULT(WINAPI*)(LPCWSTR, PBOOL, PULONG, PVOID, PULONG);\n"
              "\tauto const wof_is_external_file =\n"
              "\t\tget_library_procedure<wofutil, wof_is_external_file_t>(\"WofIsExternalFile\");\n"
              "\tif (wof_is_external_file == nullptr) return false;\n\n"
              "\tauto const native_path = convert_to_native_path_string(path);\n"
              "\tBOOL external = FALSE;\n"
              "\tULONG provider = 0;\n"
              "\tHRESULT const result = wof_is_external_file(native_path.c_str()\n"
              "\t\t, &external, &provider, nullptr, nullptr);\n\n"
              "\treturn SUCCEEDED(result) && external != FALSE && provider == wof_provider_file;\n"
              "}\n"
              "#endif\n\n",
              "",
              "remove WOF detector")

          text = replace_once(text,
              "#ifdef TORRENT_WINDOWS\n"
              "\t\t// WOF file-provider compression (CompactOS/CompactGUI) is transparently\n"
              "\t\t// readable through normal file I/O. Avoid mapping these files and use\n"
              "\t\t// the mmap backend's existing pread/pwrite fallback instead.\n"
              "\t\tif (is_wof_file_provider(names().file_path(file, m_save_path)))\n"
              "\t\t\tmode |= aux::open_mode::no_mmap;\n"
              "#endif\n\n",
              "",
              "remove WOF no-mmap override")

          text = replace_once(text,
              "\tvoid mmap_storage::need_partfile()\n"
              "\t{\n"
              "\t\tif (m_part_file) return;\n\n"
              "\t\tm_part_file = std::make_unique<part_file>(\n"
              "\t\t\tm_part_file_dir.empty() ? m_save_path : combine_path(m_save_path, m_part_file_dir)\n"
              "\t\t\t, m_part_file_name\n"
              "\t\t\t, files().num_pieces(), files().piece_length());\n"
              "\t}\n\n",
              "\tvoid mmap_storage::need_partfile()\n"
              "\t{\n"
              "\t\tif (m_part_file) return;\n\n"
              "\t\tm_part_file = std::make_unique<part_file>(\n"
              "\t\t\tm_part_file_dir.empty() ? m_save_path : combine_path(m_save_path, m_part_file_dir)\n"
              "\t\t\t, m_part_file_name\n"
              "\t\t\t, files().num_pieces(), files().piece_length());\n"
              "\t}\n\n"
              "\tbool mmap_storage::partfile_repair(piece_index_t const piece) const\n"
              "\t{\n"
              "\t\tstd::lock_guard<std::mutex> l(m_partfile_repair_mutex);\n"
              "\t\tif (m_partfile_repair.empty()) return false;\n"
              "\t\treturn m_partfile_repair[piece];\n"
              "\t}\n\n"
              "\tvoid mmap_storage::set_partfile_repair(piece_index_t const piece, bool const enabled)\n"
              "\t{\n"
              "\t\tstd::lock_guard<std::mutex> l(m_partfile_repair_mutex);\n"
              "\t\tif (m_partfile_repair.empty())\n"
              "\t\t\tm_partfile_repair.resize(files().num_pieces(), false);\n"
              "\t\tm_partfile_repair[piece] = enabled;\n"
              "\t}\n\n",
              "add partfile recovery helpers")

          # Change only the write() section.
          write_start = text.index("\tint mmap_storage::write(")
          write_end = text.index("\n\tint mmap_storage::hash(", write_start)
          write = text[write_start:write_end]
          write = replace_once(write,
              "\t\t\t, [this, mode, flags, &sett](file_index_t const file_index",
              "\t\t\t, [this, piece, mode, flags, &sett](file_index_t const file_index",
              "capture piece in write")
          write = replace_once(write,
              "\t\t\t\treturn ret;\n"
              "\t\t\t}\n\n"
              "\t\t\t// invalidate our stat cache for this file, since",
              "\t\t\t\treturn ret;\n"
              "\t\t\t}\n\n"
              "\t\t\t// This piece was made incomplete only because skipped-file data\n"
              "\t\t\t// disappeared from the part file. Rebuild that auxiliary data without\n"
              "\t\t\t// rewriting bytes that already exist in wanted files. This is\n"
              "\t\t\t// especially important for WOF-backed files, where any write may\n"
              "\t\t\t// materialize the whole compressed file.\n"
              "\t\t\tif (partfile_repair(piece))\n"
              "\t\t\t\treturn int(buf.size());\n\n"
              "\t\t\t// invalidate our stat cache for this file, since",
              "discard wanted-file writes during partfile recovery")
          text = text[:write_start] + write + text[write_end:]

          # Change only the v1 hash() section. Missing part-file data keeps the
          # normal hash error semantics, but marks the piece for one-shot repair.
          hash_start = text.index("\tint mmap_storage::hash(")
          hash_end = text.index("\n\tint mmap_storage::hash2(", hash_start)
          h = text[hash_start:hash_end]
          h = replace_once(h,
              "\t\tchar dummy = 0;\n"
              "\t\tstd::vector<char> scratch;\n\n"
              "\t\treturn readwrite(files(), span<char const>{&dummy, len}, piece, offset, error\n"
              "\t\t\t, [this, mode, flags, &ph, &sett, &scratch](file_index_t const file_index",
              "\t\tchar dummy = 0;\n"
              "\t\tstd::vector<char> scratch;\n"
              "\t\tbool const recovering_partfile = partfile_repair(piece);\n"
              "\t\tbool missing_partfile = false;\n\n"
              "\t\tint const ret = readwrite(files(), span<char const>{&dummy, len}, piece, offset, error\n"
              "\t\t\t, [this, piece, mode, flags, &ph, &sett, &scratch, &missing_partfile](file_index_t const file_index",
              "track partfile recovery in hash")
          h = replace_once(h,
              "\t\t\t\tif (e)\n"
              "\t\t\t\t{\n"
              "\t\t\t\t\tec.ec = e;\n"
              "\t\t\t\t\tec.operation = operation_t::partfile_read;\n"
              "\t\t\t\t\treturn -1;\n"
              "\t\t\t\t}",
              "\t\t\t\tif (e)\n"
              "\t\t\t\t{\n"
              "\t\t\t\t\tif (e == boost::system::errc::no_such_file_or_directory)\n"
              "\t\t\t\t\t{\n"
              "\t\t\t\t\t\tmissing_partfile = true;\n"
              "\t\t\t\t\t\tset_partfile_repair(piece, true);\n"
              "\t\t\t\t\t}\n"
              "\t\t\t\t\tec.ec = e;\n"
              "\t\t\t\t\tec.operation = operation_t::partfile_read;\n"
              "\t\t\t\t\treturn -1;\n"
              "\t\t\t\t}",
              "mark missing partfile hash")
          if not h.endswith("\t\t});\n\t}\n"):
              raise SystemExit("hash tail did not match expected structure")
          h = h[:-len("\t\t});\n\t}\n")] + (
              "\t\t});\n\n"
              "\t\t// A successful read after the part-file-only download is the one\n"
              "\t\t// verification attempt. Clear recovery mode before the torrent layer\n"
              "\t\t// compares the hash; if it still fails, the next download is a normal\n"
              "\t\t// full-piece repair. Keep recovery mode only while part-file data is\n"
              "\t\t// still missing.\n"
              "\t\tif (recovering_partfile && !missing_partfile)\n"
              "\t\t\tset_partfile_repair(piece, false);\n\n"
              "\t\treturn ret;\n"
              "\t}\n")
          text = text[:hash_start] + h + text[hash_end:]

          path.write_text(text)

          # ---- part_file.cpp ----------------------------------------------------
          path = Path("src/part_file.cpp")
          text = path.read_text()
          text = replace_once(text,
              "\taux::file_handle part_file::open_file(aux::open_mode_t const mode, error_code& ec) try\n"
              "\t{\n"
              "\t\tstd::string const fn = combine_path(m_path, m_name);\n"
              "\t\ttry {\n"
              "\t\t\treturn {fn, 0, mode};\n"
              "\t\t}\n"
              "\t\tcatch (storage_error const& e)\n"
              "\t\t{\n"
              "\t\t\tif ((mode & aux::open_mode::write)\n"
              "\t\t\t\t&& e.ec == boost::system::errc::no_such_file_or_directory)\n"
              "\t\t\t{\n"
              "\t\t\t\t// this means the directory the file is in doesn't exist.\n"
              "\t\t\t\t// so create it\n"
              "\t\t\t\tec.clear();\n"
              "\t\t\t\tcreate_directories(m_path, ec);\n"
              "\t\t\t\tif (ec) return {};\n"
              "\t\t\t\treturn {fn, 0, mode};\n"
              "\t\t\t}\n"
              "\t\t\treturn {};\n"
              "\t\t}\n"
              "\t}\n",
              "\taux::file_handle part_file::open_file(aux::open_mode_t const mode, error_code& ec) try\n"
              "\t{\n"
              "\t\tstd::string const fn = combine_path(m_path, m_name);\n"
              "\t\taux::open_mode_t file_mode = mode;\n"
              "\t\t// Part files reserve piece-sized slots but commonly contain only a\n"
              "\t\t// small boundary range in each slot. Mark write-opened part files\n"
              "\t\t// sparse so unwritten slot ranges do not consume physical disk space.\n"
              "\t\tif (file_mode & aux::open_mode::write)\n"
              "\t\t\tfile_mode |= aux::open_mode::sparse;\n\n"
              "\t\ttry {\n"
              "\t\t\treturn {fn, 0, file_mode};\n"
              "\t\t}\n"
              "\t\tcatch (storage_error const& e)\n"
              "\t\t{\n"
              "\t\t\tif ((file_mode & aux::open_mode::write)\n"
              "\t\t\t\t&& e.ec == boost::system::errc::no_such_file_or_directory)\n"
              "\t\t\t{\n"
              "\t\t\t\t// this means the directory the file is in doesn't exist.\n"
              "\t\t\t\t// so create it\n"
              "\t\t\t\tec.clear();\n"
              "\t\t\t\tcreate_directories(m_path, ec);\n"
              "\t\t\t\tif (ec) return {};\n"
              "\t\t\t\treturn {fn, 0, file_mode};\n"
              "\t\t\t}\n"
              "\t\t\treturn {};\n"
              "\t\t}\n"
              "\t}\n",
              "make part files sparse")
          path.write_text(text)
          PY

          git diff --check
          git diff -- include/libtorrent/aux_/mmap_storage.hpp src/mmap_storage.cpp src/part_file.cpp

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add include/libtorrent/aux_/mmap_storage.hpp src/mmap_storage.cpp src/part_file.cpp
          git diff --cached --check
          git commit -m "Fix selective part-file recovery"
          git push origin HEAD:custom/qbittorrent-2.1
