name: Selective recheck two-way staging

on:
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.issue.pull_request && github.event.issue.number == 33 && github.event.comment.body == '/apply-selective-two-way'
    runs-on: ubuntu-latest
    steps:
      - name: Check out helper from default branch
        uses: actions/checkout@v4
        with:
          ref: custom/qbittorrent-2.1
          path: helper

      - name: Check out hotfix branch
        uses: actions/checkout@v4
        with:
          ref: fix/selective-recheck-crash
          fetch-depth: 0
          path: work

      - name: Apply two-way selective recheck and bounded scheduling
        working-directory: work
        run: python ../helper/.github/selective_recheck_two_way.py

      - name: Commit source changes
        working-directory: work
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/torrent_handle.cpp include/libtorrent/torrent_handle.hpp test/test_selective_recheck.cpp
          git diff --cached --check
          git commit -m "fix: make selective recheck two-way"
          git push origin HEAD:fix/selective-recheck-crash
