name: Apply WOF mmap fallback patch

on:
  push:
    branches:
      - fix/wof-mmap-fallback

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wof-mmap-fallback
          fetch-depth: 0

      - name: Apply source patch
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/mmap_storage.cpp")
          text = path.read_text(encoding="utf-8")

          old = '#include <optional>\n\n#include "libtorrent/aux_/disable_warnings_push.hpp"'
          new = '''#include <optional>\n\n#ifdef TORRENT_WINDOWS\n#include "libtorrent/aux_/win_util.hpp"\n#ifndef WIN32_LEAN_AND_MEAN\n#define WIN32_LEAN_AND_MEAN\n#endif\n#include <windows.h>\n#include <wofapi.h>\n#endif\n\n#include "libtorrent/aux_/disable_warnings_push.hpp"'''
          if old not in text:
              raise SystemExit("include insertion point not found")
          text = text.replace(old, new, 1)

          old = 'namespace {\n\nerror_code translate_error(std::error_code const& err, bool const write)'
          new = '''namespace {\n\n#ifdef TORRENT_WINDOWS\nstruct wofutil\n{\n\tstatic constexpr char const* library_name = "Wofutil.dll";\n};\n\nbool is_wof_file_provider(std::string const& path)\n{\n\tusing wof_is_external_file_t = HRESULT(WINAPI*)(LPCWSTR, PBOOL, PULONG, PVOID, PULONG);\n\tauto const wof_is_external_file =\n\t\tget_library_procedure<wofutil, wof_is_external_file_t>("WofIsExternalFile");\n\tif (wof_is_external_file == nullptr) return false;\n\n\tauto const native_path = convert_to_native_path_string(path);\n\tBOOL external = FALSE;\n\tULONG provider = 0;\n\tHRESULT const result = wof_is_external_file(native_path.c_str()\n\t\t, &external, &provider, nullptr, nullptr);\n\n\treturn SUCCEEDED(result) && external != FALSE && provider == WOF_PROVIDER_FILE;\n}\n#endif\n\nerror_code translate_error(std::error_code const& err, bool const write)'''
          if old not in text:
              raise SystemExit("helper insertion point not found")
          text = text.replace(old, new, 1)

          old = '''\t\tif (files().file_size(file) / default_block_size\n\t\t\t<= sett.get_int(settings_pack::mmap_file_size_cutoff))\n\t\t\tmode |= aux::open_mode::no_mmap;'''
          new = '''#ifdef TORRENT_WINDOWS\n\t\t// WOF file-provider compression (CompactOS/CompactGUI) is transparently\n\t\t// readable through normal file I/O. Avoid mapping these files and use\n\t\t// the mmap backend's existing pread/pwrite fallback instead.\n\t\tif (is_wof_file_provider(names().file_path(file, m_save_path)))\n\t\t\tmode |= aux::open_mode::no_mmap;\n#endif\n\n\t\tif (files().file_size(file) / default_block_size\n\t\t\t<= sett.get_int(settings_pack::mmap_file_size_cutoff))\n\t\t\tmode |= aux::open_mode::no_mmap;'''
          if old not in text:
              raise SystemExit("no_mmap insertion point not found")
          text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")

      - name: Validate patch
        run: |
          git diff --check
          git diff -- src/mmap_storage.cpp

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mmap_storage.cpp
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Fix: avoid mmap for WOF-compressed files"
          git push origin HEAD:fix/wof-mmap-fallback
