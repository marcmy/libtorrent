name: Fix pread recovery hash capture

on:
  push:
    branches:
      - custom/qbittorrent-2.1
    paths:
      - .github/workflows/fix-pread-recovery-capture.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: custom/qbittorrent-2.1
          fetch-depth: 0
      - name: Fix capture
        shell: python
        run: |
          from pathlib import Path
          p = Path("src/pread_storage.cpp")
          s = p.read_text()
          old = "\t\t\t, [this, mode, flags, &ph, &sett, &scratch_buffer](\n\t\t\t\tfile_index_t const file_index"
          new = "\t\t\t, [this, piece, mode, flags, &ph, &sett, &scratch_buffer](\n\t\t\t\tfile_index_t const file_index"
          if s.count(old) != 1:
              raise SystemExit(f"expected one hash-lambda capture, found {s.count(old)}")
          p.write_text(s.replace(old, new, 1))
          Path(".github/workflows/fix-pread-recovery-capture.yml").unlink()
      - name: Validate and push
        run: |
          git diff --check
          git diff
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix pread recovery hash lambda capture"
          git push origin HEAD:custom/qbittorrent-2.1
