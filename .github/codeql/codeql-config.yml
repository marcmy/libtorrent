name: "CodeQL config"

paths-ignore:
  - deps/**

query-filters:
  - exclude:
      id: actions/missing-workflow-permissions
  - exclude:
      id: actions/unpinned-tag
  - exclude:
      id: py/file-not-closed
  - exclude:
      id: py/imprecise-assert
  - exclude:
      id: py/unused-import
  - exclude:
      id: py/unused-local-variable
  - exclude:
      id: py/unused-global-variable
  - exclude:
      id: py/commented-out-code
  - exclude:
      id: py/empty-except
  - exclude:
      id: cpp/poorly-documented-function
  - exclude:
      id: cpp/commented-out-code
  - exclude:
      id: cpp/long-switch
  - exclude:
      id: cpp/unused-local-variable
  - exclude:
      id: cpp/unused-static-function
  - exclude:
      id: cpp/unused-static-variable
  - exclude:
      id: cpp/declaration-hides-parameter
  - exclude:
      id: cpp/large-parameter
  - exclude:
      id: cpp/complex-block
